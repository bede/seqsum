[package]
name = "seqsum"
version = "0.3.0"
edition = "2024"
description = "Robust sequence checksums for FASTA/FASTQ"
license = "MIT"
repository = "https://github.com/bede/seqsum"
homepage = "https://github.com/bede/seqsum"
keywords = ["bioinformatics", "genomics", "fasta", "fastq", "checksums"]
categories = ["science", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
paraseq = { version = "0.4.3", default-features = false, features = ["anyhow", "niffler"] }
rapidhash = "4.1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
